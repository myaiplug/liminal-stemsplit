name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APP_DIR: stemsplit-desktop_app/StemSplit1-main
  NEXT_TELEMETRY_DISABLED: 1
  TAURI_SKIP_DEVTOOLS_INSPECTOR: true

jobs:
  build-windows:
    runs-on: windows-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}

      - run: npm run build
        working-directory: ${{ env.APP_DIR }}

      - run: cargo tauri build --bundles msi,nsis
        working-directory: ${{ env.APP_DIR }}/src-tauri
        env:
          TAURI_BUNDLE_WINDOWS_CODESIGN: "false"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/msi/*.msi
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}

      - run: npm run build
        working-directory: ${{ env.APP_DIR }}

      - name: Build macOS dmg (Apple Silicon)
        run: cargo tauri build --bundles dmg --target aarch64-apple-darwin
        working-directory: ${{ env.APP_DIR }}/src-tauri

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ env.APP_DIR }}/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}

      - run: npm run build
        working-directory: ${{ env.APP_DIR }}

      - run: cargo tauri build --bundles deb,appimage
        working-directory: ${{ env.APP_DIR }}/src-tauri
        env:
          TAURI_BUNDLE_LINUX_CODESIGN: "false"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/deb/*.deb
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/appimage/*.AppImage