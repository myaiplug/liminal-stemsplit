name: Build & Release v0.5.0

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  APP_DIR: stemsplit-desktop_app/StemSplit1-main
  RELEASE_VERSION: ${{ github.ref_name }}
  NEXT_TELEMETRY_DISABLED: 1
  TAURI_SKIP_DEVTOOLS_INSPECTOR: true

jobs:
  billing-smoke:
    uses: ./.github/workflows/billing-smoke.yml

  build-windows:
    needs: billing-smoke
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install app dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}

      - name: Build frontend
        run: npm run build
        working-directory: ${{ env.APP_DIR }}

      - name: Build Tauri Windows bundles (MSI + NSIS)
        run: cargo tauri build --bundles msi,nsis
        working-directory: ${{ env.APP_DIR }}/src-tauri
        env:
          TAURI_BUNDLE_WINDOWS_CODESIGN: 'false'

      - name: Compile release executable for Inno Setup
        run: cargo build --release
        working-directory: ${{ env.APP_DIR }}/src-tauri

      - name: Stage FFmpeg for installer
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          if (-not (Test-Path ffmpeg\bin\ffmpeg.exe)) {
            $zip = 'ffmpeg_ci.zip'
            Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile $zip
            Expand-Archive $zip -DestinationPath ffmpeg_extract -Force
            $bin = Get-ChildItem ffmpeg_extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
            $probe = Get-ChildItem ffmpeg_extract -Recurse -Filter ffprobe.exe | Select-Object -First 1
            New-Item -ItemType Directory -Path ffmpeg\bin -Force | Out-Null
            Copy-Item $bin.FullName ffmpeg\bin\ffmpeg.exe
            Copy-Item $probe.FullName ffmpeg\bin\ffprobe.exe
          }

      - name: Build Inno Setup online installer
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        env:
          STEMSPLIT_INSTALLER_SKIP_ONLINE_DOWNLOADS: '1'
        run: .\build_complete_installer.ps1 -Online -SkipBuild

      - name: Collect Windows checksums
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $files = @()
          $files += Get-ChildItem src-tauri\target\release\bundle\msi\*.msi -ErrorAction SilentlyContinue
          $files += Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe -ErrorAction SilentlyContinue
          $files += Get-ChildItem installers\Liminal-StemSplit-Setup-*-Windows-x64-Online.exe -ErrorAction SilentlyContinue
          if ($files.Count -eq 0) { throw 'No Windows installer artifacts found' }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content installers\checksums-windows.sha256 -Encoding UTF8

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/msi/*.msi
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.APP_DIR }}/installers/Liminal-StemSplit-Setup-*-Windows-x64-Online.exe
            ${{ env.APP_DIR }}/installers/checksums-windows.sha256
          if-no-files-found: error
          retention-days: 14

  build-macos:
    needs: billing-smoke
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install app dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}

      - name: Build frontend
        run: npm run build
        working-directory: ${{ env.APP_DIR }}

      - name: Build macOS DMG (Apple Silicon)
        run: cargo tauri build --bundles dmg --target aarch64-apple-darwin
        working-directory: ${{ env.APP_DIR }}/src-tauri
        env:
          TAURI_BUNDLE_MACOS_CODESIGN: 'false'

      - name: Collect macOS checksums
        run: |
          DMG=$(find "${{ env.APP_DIR }}/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg" -name '*.dmg' | head -n 1)
          test -n "$DMG"
          mkdir -p "${{ env.APP_DIR }}/installers"
          shasum -a 256 "$DMG" | awk '{print tolower($1) "  " $2}' > "${{ env.APP_DIR }}/installers/checksums-mac.sha256"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            ${{ env.APP_DIR }}/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            ${{ env.APP_DIR }}/installers/checksums-mac.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: release-assets/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-installers
          path: release-assets/macos

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Liminal StemSplit ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/windows/**
            release-assets/macos/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}