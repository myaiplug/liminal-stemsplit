name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  APP_DIR: stemsplit-desktop_app/StemSplit1-main

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}

      - run: npm run build
        working-directory: ${{ env.APP_DIR }}

      - run: npx tauri build --bundles msi,nsis
        working-directory: ${{ env.APP_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/msi/*.msi
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}

      - run: npm run build
        working-directory: ${{ env.APP_DIR }}

      - run: npx tauri build --bundles dmg --target ${{ matrix.target }}
        working-directory: ${{ env.APP_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - run: npm ci --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}

      - run: npm run build
        working-directory: ${{ env.APP_DIR }}

      - run: npx tauri build --bundles deb,appimage
        working-directory: ${{ env.APP_DIR }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/deb/*.deb
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/appimage/*.AppImage
