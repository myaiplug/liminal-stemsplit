<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're In — Liminal</title>
<meta name="description" content="Thank you for joining the Liminal early access list.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['Inter', 'sans-serif'] },
      colors: {
        liminal: { 50:'#ecfeff',100:'#cffafe',200:'#a5f3fc',300:'#67e8f9',400:'#22d3ee',500:'#06b6d4',600:'#0891b2',700:'#0e7490',800:'#155e75',900:'#164e63',950:'#083344' }
      }
    }
  }
}
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#020617;color:#fafafa;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.glass{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(20px)}
.gradient-text{background:linear-gradient(135deg,#06b6d4,#22d3ee,#0891b2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn-primary{display:inline-flex;align-items:center;gap:0.5rem;padding:0.875rem 2rem;border-radius:9999px;background:linear-gradient(135deg,#0891b2,#06b6d4);color:#fff;font-weight:600;font-size:0.9375rem;transition:all 0.3s;border:none;cursor:pointer}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 20px 60px rgba(6,182,212,0.35)}
#fade-in{animation:fadeIn 0.8s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
  <main class="text-center px-6" id="fade-in">
    <div class="text-5xl mb-6">✓</div>
    <h1 class="text-4xl md:text-5xl font-bold tracking-tight">You're <span class="gradient-text">On the List</span></h1>
    <p class="text-white/40 text-lg mt-4 max-w-md mx-auto leading-relaxed">
      Check your inbox for a welcome email. We'll notify you when the full desktop app launches.
    </p>
    <div class="flex flex-wrap justify-center gap-4 mt-10">
      <a href="/#demo" class="btn-primary">Try the Web Demo</a>
      <a href="/" class="text-sm text-white/40 hover:text-white/70 transition-colors mt-3">Back to Home</a>
    </div>
  </main>
</body>
</html>
