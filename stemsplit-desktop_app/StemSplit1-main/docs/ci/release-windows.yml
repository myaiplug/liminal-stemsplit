name: Release (Windows, signed updater)

# Builds the Windows installers (NSIS + MSI) with Tauri, signs the updater artifacts and, for a tag,
# uploads installers + latest.json to a DRAFT GitHub Release.
#
#   • push tag v*            -> build + signed updater artifacts + DRAFT release (never auto-published)
#   • workflow_dispatch      -> build + signed artifacts uploaded as workflow artifacts only,
#                               unless "draft_release" is ticked (then a DRAFT release v<VERSION> is created)
#
# The Tauri updater verifies downloads against the public key in src-tauri/tauri.conf.json using the
# private key stored in the repo secrets TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Also create/update a DRAFT GitHub Release (v<VERSION>) with installers + latest.json'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_DIR: stemsplit-desktop_app/StemSplit1-main
  NEXT_TELEMETRY_DISABLED: 1
  TAURI_SKIP_DEVTOOLS_INSPECTOR: true

jobs:
  checks:
    name: Version + Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: All version strings agree with APP/VERSION
        run: python scripts/sync_version.py --check
        working-directory: ${{ env.APP_DIR }}

      - name: Tag matches VERSION (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="v$(tr -d '[:space:]' < VERSION)"
          if [ "$want" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match VERSION file ($want). Run scripts/sync_version.py and re-tag."
            exit 1
          fi
        working-directory: ${{ env.APP_DIR }}

      - name: Python unit tests (recovery, doctor, catalog)
        run: |
          python -m pip install pytest
          python -m pytest tests -q
        working-directory: ${{ env.APP_DIR }}/scripts

      - name: py_compile backend scripts
        run: python -m compileall -q scripts
        working-directory: ${{ env.APP_DIR }}

  build-windows:
    name: Build Windows installers
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content "$env:APP_DIR/VERSION" -Raw).Trim()
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.APP_DIR }}/src-tauri

      - name: Install app dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}

      - name: Decide release mode
        id: mode
        shell: pwsh
        run: |
          $publish = ($env:GITHUB_REF -like 'refs/tags/v*') -or ('${{ inputs.draft_release }}' -eq 'true')
          if ($publish) {
            "tag=v${{ steps.ver.outputs.version }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "tag=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      # tauri-action runs `npm run build` through beforeBuildCommand, builds NSIS + MSI, signs the
      # updater artifacts with TAURI_SIGNING_PRIVATE_KEY and (when tagName is set) uploads everything
      # plus latest.json to a draft release.
      - name: Build Tauri bundles and updater artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ${{ env.APP_DIR }}
          tauriScript: npx tauri
          args: --bundles nsis,msi
          tagName: ${{ steps.mode.outputs.tag }}
          releaseName: 'Liminal StemSplit v__VERSION__'
          releaseBody: 'See CHANGELOG.md for the full list of changes. Windows: run the NSIS setup (.exe) or the MSI. Installed copies update themselves in-app.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Verify bundle + signatures
        shell: pwsh
        working-directory: ${{ env.APP_DIR }}
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          $nsis = Get-ChildItem "$bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          $msi  = Get-ChildItem "$bundle/msi/*.msi" -ErrorAction SilentlyContinue
          if (-not $nsis) { throw 'NSIS installer missing' }
          if (-not $msi)  { throw 'MSI installer missing' }
          foreach ($f in @($nsis) + @($msi)) {
            if (-not (Test-Path "$($f.FullName).sig")) { throw "Updater signature missing for $($f.Name)" }
          }
          $files = @($nsis) + @($msi)
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          New-Item -ItemType Directory -Path installers -Force | Out-Null
          $lines | Set-Content installers/checksums-windows.sha256 -Encoding UTF8
          $lines

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers-v${{ steps.ver.outputs.version }}
          path: |
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/nsis/*.exe.sig
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/msi/*.msi
            ${{ env.APP_DIR }}/src-tauri/target/release/bundle/msi/*.msi.sig
            ${{ env.APP_DIR }}/installers/checksums-windows.sha256
          if-no-files-found: error
          retention-days: 14
