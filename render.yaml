# Free deployment on Render.com
# Docs: https://render.com/docs/deploy-node-express-app
services:
  - type: web
    name: liminal-stemsplit
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SITE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: STRIPE_PAYMENT_LINK_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: BILLING_ADMIN_TOKEN
        sync: false